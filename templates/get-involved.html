<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Involved — PPBS</title>
  <link rel="stylesheet" href="css/l6.css">
</head>
<body data-page="get-involved">

{{topbar}}

<div class="page-header">
  <div class="sec-label">Collaborate</div>
  <div class="header-body">
    <h1><span>Get</span> Involved</h1>
    <p class="subtitle">Join the PPBS research program as a collaborator, data user, or contributor.</p>
  </div>
</div>

<div class="page-content">
  <div class="sec-label">About</div>
  <div class="content-body">
    {{content}}

    <h2>Contact Us</h2>
    <form class="contact-form" action="https://formspree.io/f/ppbs" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="affiliation">Affiliation</label>
      <input type="text" id="affiliation" name="affiliation">

      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>
</div>

{{footer}}

<script src="js/nav.js"></script>
</body>
</html>
